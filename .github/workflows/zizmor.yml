# Audits the calling repository's workflows with zizmor: template
# injection, credentials left in checkouts, excessive permissions, unpinned
# actions and the other GitHub Actions pitfalls. A finding fails the job and
# is annotated on the pull request.
#
#   jobs:
#     zizmor:
#       uses: Vexatra/.github/.github/workflows/zizmor.yml@<sha> # v<version>
#       with:
#         runner: '["self-hosted", "linux", "vexatra"]'   # private repositories
#
# zizmor is installed from PyPI into a throwaway virtual environment rather
# than run from its Docker image, so the job also runs on self-hosted runners
# whose user has no Docker access.
name: zizmor

on:
  workflow_call:
    inputs:
      runner:
        description: JSON for runs-on. Private repositories pass their self-hosted labels, since GitHub-hosted minutes are limited for them.
        type: string
        default: '"ubuntu-24.04"'

permissions: {}

jobs:
  zizmor:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows
        env:
          VERSION: 1.30.1
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check "zizmor==$VERSION"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --format=github .
